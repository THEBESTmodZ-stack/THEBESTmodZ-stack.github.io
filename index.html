<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THEBESTmodZ Access</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      background: #1e1e1e;
      border-radius: 15px;
    }

    .item {
      background: #2b2b2b;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      text-align: left;
    }

    .value {
      margin-top: 8px;
      font-size: 20px;
      word-break: break-all;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: 0;
      border-radius: 7px;
    }

    #timer {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>THEBESTmodZ</h1>
  <p>Access Portal</p>

  <div class="item">
    <strong>Access Code</strong>
    <div class="value" id="code">Loading...</div>
    <button onclick="copyCode()">Copy Code</button>
  </div>

  <div id="timer">
    Expiry: <span id="countdown">Loading...</span>
  </div>
</div>

<script type="module">

  // Firebase connection goes here.
  // We will add your Firebase web configuration
  // in the next step.

  function copyCode() {
    const code = document.getElementById("code").innerText;

    navigator.clipboard.writeText(code);
    alert("Code copied!");
  }

</script>

</body>
</html>
