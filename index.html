<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THEBESTmodZ Access</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#120018,#25003d,#4a0072);
  font-family:Arial,sans-serif;
  color:white;
}

.box{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  border:1px solid rgba(156,39,176,0.4);
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 30px rgba(156,39,176,0.5);
}

h1{
  text-align:center;
  color:#d896ff;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  opacity:.8;
  margin-bottom:25px;
}

.item{
  background:rgba(255,255,255,0.06);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.label{
  font-size:14px;
  opacity:.8;
}

.value{
  font-size:20px;
  color:#d896ff;
  margin-top:8px;
  word-break:break-all;
}

button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#9C27B0;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.timer{
  text-align:center;
  margin-top:20px;
  font-size:18px;
}

.countdown{
  color:#d896ff;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

  <h1>👑 THEBESTmodZ</h1>
  <div class="subtitle">Premium Access Portal</div>

  <div class="item">
    <div class="label">Username</div>
    <div class="value" id="username">Loading...</div>
    <button onclick="copyUsername()">Copy Username</button>
  </div>

  <div class="item">
    <div class="label">Access Key</div>
    <div class="value" id="code">Loading...</div>
    <button onclick="copyCode()">Copy Key</button>
  </div>

  <div class="timer">
    ⏳ Expires In:
    <span class="countdown" id="countdown">Loading...</span>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKnbL750l0jFCkstt4AEOkj5ihNvyDpKk",
  authDomain: "thebestmodz.firebaseapp.com",
  projectId: "thebestmodz",
  storageBucket: "thebestmodz.firebasestorage.app",
  messagingSenderId: "292853293613",
  appId: "1:292853293613:web:f347ef56932532b8d9cea4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadAccess() {

  try {

    const ref = doc(db,"settings","access");
    const snapshot = await getDoc(ref);

    if(!snapshot.exists()){

      document.getElementById("username").innerText =
        "Not Found";

      document.getElementById("code").innerText =
        "Not Found";

      document.getElementById("countdown").innerText =
        "Unavailable";

      return;
    }

    const data = snapshot.data();

    document.getElementById("username").innerText =
      data.username || "THEBESTmodZ";

    document.getElementById("code").innerText =
      data.code || "259321";

    if(data.expiresAt){
      startCountdown(data.expiresAt.toMillis());
    }else{
      document.getElementById("countdown").innerText =
        "No expiry set";
    }

  } catch(error){

    console.error(error);

    document.getElementById("username").innerText =
      "Unable to load";

    document.getElementById("code").innerText =
      "Unable to load";

    document.getElementById("countdown").innerText =
      "Unavailable";
  }
}

function startCountdown(expiry){

  function update(){

    const remaining = expiry - Date.now();

    if(remaining <= 0){
      document.getElementById("countdown").innerText =
        "EXPIRED";
      return;
    }

    const minutes =
      Math.floor(remaining / 60000);

    const seconds =
      Math.floor((remaining % 60000) / 1000);

    document.getElementById("countdown").innerText =
      minutes + ":" +
      String(seconds).padStart(2,"0");

    setTimeout(update,1000);
  }

  update();
}

window.copyUsername = function(){

  const username =
    document.getElementById("username").innerText;

  navigator.clipboard.writeText(username)
    .then(() => alert("Username copied!"));
}

window.copyCode = function(){

  const code =
    document.getElementById("code").innerText;

  navigator.clipboard.writeText(code)
    .then(() => alert("Access key copied!"));
}

loadAccess();

</script>

</body>
</html>
