<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THEBESTmodZ Access</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      background: #1e1e1e;
      border-radius: 15px;
    }

    .item {
      background: #2b2b2b;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      text-align: left;
    }

    .value {
      margin-top: 8px;
      font-size: 20px;
      word-break: break-all;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    #timer {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>THEBESTmodZ</h1>
    <p>Access Portal</p>

    <div class="item">
      <strong>Access Code</strong>
      <div class="value" id="code">Loading...</div>
      <button onclick="copyCode()">Copy Code</button>
    </div>

    <div id="timer">
      Expiry: <span id="countdown">Loading...</span>
    </div>
  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
       ========================= */

    const firebaseConfig = {

      apiKey: "AIzaSyAKnbL750l0jFCkstt4AEOkj5ihNvyDpKk",

      authDomain: "thebestmodz.firebaseapp.com",

      projectId: "thebestmodz",

      storageBucket: "thebestmodz.firebasestorage.app",

      messagingSenderId: "292853293613",

      appId: "1:292853293613:web:f347ef56932532b8d9cea4"

    };


    /* =========================
       START FIREBASE
       ========================= */

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    /* =========================
       LOAD ACCESS CODE
       ========================= */

    async function loadAccess() {

      try {

        const ref = doc(db, "settings", "access");

        const snapshot = await getDoc(ref);


        if (!snapshot.exists()) {

          document.getElementById("code").innerText =
            "No access code found";

          document.getElementById("countdown").innerText =
            "Unavailable";

          return;
        }


        const data = snapshot.data();


        document.getElementById("code").innerText =
          data.code || "No code";


        if (data.expiresAt) {

          startCountdown(
            data.expiresAt.toMillis()
          );

        } else {

          document.getElementById("countdown").innerText =
            "No expiry set";

        }

      }

      catch (error) {

        console.error(error);

        document.getElementById("code").innerText =
          "Unable to load";

        document.getElementById("countdown").innerText =
          "Unavailable";

      }

    }


    /* =========================
       COUNTDOWN
       ========================= */

    function startCountdown(expiry) {

      function update() {

        const remaining =
          expiry - Date.now();


        if (remaining <= 0) {

          document.getElementById("countdown").innerText =
            "EXPIRED";

          return;

        }


        const minutes =
          Math.floor(remaining / 60000);


        const seconds =
          Math.floor(
            (remaining % 60000) / 1000
          );


        document.getElementById("countdown").innerText =
          minutes + ":" +
          String(seconds).padStart(2, "0");


        setTimeout(update, 1000);

      }


      update();

    }


    /* =========================
       COPY CODE
       ========================= */

    window.copyCode = function() {

      const code =
        document.getElementById("code").innerText;


      navigator.clipboard.writeText(code)
        .then(function() {

          alert("Code copied!");

        });

    };


    /* =========================
       START
       ========================= */

    loadAccess();

  </script>

</body>
</html>
