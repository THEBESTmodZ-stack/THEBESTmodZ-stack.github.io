<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THEBESTmodZ Access</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 400px;
      margin: 70px auto;
      padding: 25px;
      background: #1e1e1e;
      border-radius: 15px;
    }

    .item {
      background: #333;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      text-align: left;
    }

    .value {
      font-size: 19px;
      margin-top: 8px;
      word-break: break-all;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>THEBESTmodZ</h1>
    <p>Access Details</p>

    <div class="item">
      <strong>Username</strong>
      <div class="value" id="username">BESTUSER123</div>
      <button onclick="copyText('username')">Copy Username</button>
    </div>

    <div class="item">
      <strong>Password</strong>
      <div class="value" id="password">ABC123</div>
      <button onclick="copyText('password')">Copy Password</button>
    </div>
  </div>

  <script>
    function copyText(id) {
      const text = document.getElementById(id).innerText;

      navigator.clipboard.writeText(text).then(function() {
        alert("Copied!");
      });
    }
  </script>

</body>
</html>
